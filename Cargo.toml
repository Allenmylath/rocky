[package]
name = "dx-ai-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI
dioxus = { version = "0.7.9", features = ["desktop"] }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1.18"
futures = "0.3.32"

# LLM / HTTP — rustls only, no OpenSSL
reqwest = { version = "0.13", features = ["json", "stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Native file/folder picker
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true